<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-header__brand" href="{{ '/' | relative_url }}">
      <span class="site-header__brand-mark" aria-hidden="true"></span>
      <span class="site-header__brand-text">{{ site.title }}</span>
    </a>

    <div class="site-header__actions">
    <nav class="site-nav" aria-label="Primary navigation">
      <button class="site-nav__toggle" aria-expanded="false" aria-controls="site-nav__list">
        <span class="sr-only">Menu</span>
        <span class="site-nav__toggle-bars"></span>
      </button>

      <ul class="site-nav__list" id="site-nav__list">
        {% for item in site.nav %}
          <li class="site-nav__item site-nav__item--{{ item.accent }}">
            <a href="{{ item.path | relative_url }}"
               class="site-nav__link{% if page.url == item.path or page.section == item.key %} site-nav__link--active{% endif %}">
              {{ item.label }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>
      <div class="theme-controls">
        <button class="theme-auto" type="button" aria-label="Disable automatic theme" aria-pressed="true" title="Follow system theme">Auto</button>
        <button class="theme-toggle" type="button" aria-label="Switch color theme" aria-pressed="false" title="Switch color theme" aria-hidden="true">
          <span class="theme-toggle__option" aria-hidden="true"><span class="theme-toggle__dot theme-toggle__dot--warm" aria-hidden="true"></span></span>
          <span class="theme-toggle__option" aria-hidden="true"><span class="theme-toggle__dot theme-toggle__dot--cool" aria-hidden="true"></span></span>
        </button>
      </div>
    </div>
  </div>
</header>
