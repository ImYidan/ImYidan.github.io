<footer class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__col">
      <p class="site-footer__title">{{ site.title }}</p>
      <p class="site-footer__text">{{ site.tagline }}</p>
    </div>

    <nav class="site-footer__nav" aria-label="Footer navigation">
      {% for item in site.nav %}
        <a href="{{ item.path | relative_url }}">{{ item.label }}</a>
      {% endfor %}
    </nav>

    <div class="site-footer__meta">
      <p>
        {% assign year = site.time | date: '%Y' %}
        &copy; {{ year }} {{ site.author.name }} .
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </p>
      <p class="site-footer__built">
        Powered by <a href="https://jekyllrb.com" target="_blank" rel="noopener">Jekyll</a>
      </p>
    </div>
  </div>
</footer>
