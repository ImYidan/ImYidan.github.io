# ════════════════════════════════════════════════════════════
#  Site configuration
# ════════════════════════════════════════════════════════════

title: Yidan
tagline: Notes on life, learning, and places along the way.
description: Yidan's personal website — experience, travels, and notes from the journey.

# For project sites, set baseurl to "/your-repo-name".
# For user/org sites (user.github.io), set to "".
baseurl: ""
url: "https://imyidan.github.io"

author:
  name: Yidan
  email: ""
  github: ImYidan
  twitter: ""
  instagram: ""

lang: en

# Palette: paper | mist | sand | sage | ink | dusk
#   paper -- warm cream background (default)
#   mist  -- cool light gray
#   sand  -- warm beige, like aged manuscript paper
#   sage  -- muted green-tinted, calm and botanical
#   ink   -- dark mode, deep charcoal
#   dusk  -- dark blue-gray, cool and contemplative
palette: paper

# ════════════════════════════════════════════════════════════
#  Build settings
# ════════════════════════════════════════════════════════════

theme: null

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

permalink: /posts/:title/

# Optional modules. Every module ships with sample data and works in demo mode.
# Set backend.mode to "cloudflare" after creating the D1 database described in
# README.md.
features:
  posts: false
  home_stats: false
  guestbook: false
  guestbook_likes: false
  story_tree: false
  travel_rankings: false

backend:
  mode: static
  api_base: /api

# All collections live under content/ for a clean root.
collections_dir: content

plugins: []

# Custom collections.
# Most use output: false -- content is rendered inline on their
# listing pages, not as standalone URLs.
collections:
  about:
    output: false
  experience:
    output: false
  travels:
    output: false
  books:
    output: false
  writing:
    output: false
  recipes:
    output: false

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      lang: en
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      lang: en
      section: posts

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
  - LICENSE
  - "*.gemspec"
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - vendor/
  - functions/
  - test/
  - docs/
  - assets/data/story_tree.json
  - assets/js/bookshelf.js
  - assets/js/cards.js
  - assets/js/engagement.js
  - assets/js/friends.js
  - assets/js/home-stats.js
  - assets/js/listing.js
  - assets/js/message.js
  - assets/js/posts.js
  - assets/js/recipes.js
  - assets/js/search.js
  - assets/js/story-tree.js
  - assets/js/travel-rankings.js
  - assets/js/travels-rankings.js
  - assets/js/writing-cards.js
  - assets/js/writing-gallery.js
  - assets/js/writing.js
  - _private-data/
  - migrations/
  - wrangler.toml
  - jekyll-dev.out.log
  - jekyll-dev.err.log
  - _site_verify/
  - _site_dev/
  - pages/bookshelf/
  - pages/friends/
  - pages/message/
  - pages/posts/
  - pages/recipes/
  - pages/writing/
  - content/_posts/

sass:
  style: compressed
  sass_dir: _sass
  sourcemap: never

# ════════════════════════════════════════════════════════════
#  Navigation -- read by _includes/nav.html.
#  Each accent must be one of: sakura / sora / matcha / yuzu / sumire.
# ════════════════════════════════════════════════════════════

logo: /assets/favicon.svg

nav:
  - { key: "about", label: "About", path: "/about/", accent: "sora" }
  - { key: "experience", label: "Experience", path: "/experience/", accent: "sora" }
  - { key: "travels", label: "Travels", path: "/travels/", accent: "sora" }
